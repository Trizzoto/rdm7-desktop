name: Release Desktop App

# Tag a commit `v*` (matching the version in src-tauri/tauri.conf.json) to
# build installers for every platform AND the signed self-update artifacts.
#
# tauri-action does the heavy lifting: runs `cargo tauri build` (which runs
# the frontend merge via beforeBuildCommand), signs each bundle with
# TAURI_SIGNING_PRIVATE_KEY (repo secret; pubkey lives in tauri.conf.json),
# generates latest.json with per-platform signatures, and uploads everything
# to the GitHub release. Installed apps poll
#   https://github.com/Trizzoto/rdm7-desktop/releases/latest/download/latest.json
# and self-update through the in-app banner.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Serialized: parallel jobs race on updating the shared latest.json
      # release asset (read-modify-write) — the loser 404s on a stale asset
      # id and its platform entries vanish from the updater manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (frontend merge — tauri beforeBuildCommand)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build, sign, and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RDM Studio ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install. Installed apps update themselves automatically.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # ── Mirror the installers to the PUBLIC releases repo ───────────────────
  # The code repo is private, so its release assets 404 for anyone without
  # access: downloads AND the updater manifest installed copies poll. This
  # copies the finished assets (nothing else) to rdm7-studio-releases, which
  # is public and holds build output only.
  #
  # Needs a RELEASES_TOKEN secret: a fine-grained PAT scoped to
  # Trizzoto/rdm7-studio-releases with Contents: read and write. The built-in
  # GITHUB_TOKEN cannot write to another repository.
  mirror-public:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Copy the release assets to the public repo
        env:
          TAG: ${{ github.ref_name }}
          SRC: ${{ github.repository }}
          DST: Trizzoto/rdm7-studio-releases
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh release download "$TAG" --repo "$SRC"
          ls -la
          export GH_TOKEN=${{ secrets.RELEASES_TOKEN }}
          gh release view "$TAG" --repo "$DST" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$DST"               --title "RDM Studio $TAG"               --notes "Installers for RDM Studio $TAG. Installed copies update themselves."
          gh release upload "$TAG" --repo "$DST" --clobber *
