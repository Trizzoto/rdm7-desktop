[package]
name = "rdm7-desktop"
version = "0.7.2"
edition = "2021"
description = "RDM Studio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: lets the webview stream a chosen file from disk with range
# requests. A gigabyte of race video handed over as a blob breaks the media
# stack — it seeks, reports ready, and then never shows another frame.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
if-addrs = "0.13"
serialport = "4"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tauri-plugin-updater = "2"
semver = "1"
tempfile = "3"

# ── Build profiles ────────────────────────────────────────────────────
# Debug info is the bulk of what makes `target/` enormous — tens of GB of
# .pdb on Windows. Turning it off keeps dev builds on a small disk and
# cuts link time. The cost is that a native debugger (and Rust panic
# backtraces with line numbers) no longer resolves symbols; set
# `debug = 1` temporarily if you need to step through Rust code.
[profile.dev]
debug = 0

# Release stays at the cargo defaults for LTO and codegen-units on
# purpose. `lto = "fat"` / `codegen-units = 1` produce a smaller binary
# but do the final optimisation in ONE process holding the whole crate
# graph — several GB of peak RSS. That is the one thing an 8 GB machine
# cannot page its way out of. Leave these alone unless building on CI.
[profile.release]
debug = 0
strip = true
